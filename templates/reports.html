{% extends 'base.html' %}{% block page_title %}Reportes{% endblock %}{% block content %}<section class="hero-card"><div><span class="kicker">EXPORTACIÓN</span><h2>Reporte ejecutivo de cumplimiento</h2><p>Genera un archivo Excel con evaluaciones y hallazgos.</p></div></section><section class="panel">{% if session.role=='cliente' %}<a class="btn primary" href="{{url_for('report_excel')}}">Descargar mi reporte Excel</a>{% else %}<form action="{{url_for('report_excel')}}" method="get" class="report-form"><label>Cliente<select name="cliente_id" required><option value="">Selecciona…</option>{% for c in clients %}<option value="{{c.id}}">{{c.nombre}}</option>{% endfor %}</select></label><button class="btn primary">Generar Excel</button></form>{% endif %}</section>{% endblock %}
